# Deploys every push on main to GitHub Pages via the gh-pages branch —
# the branch method auto-provisions Pages on public repos and needs no
# settings API (configure-pages' enablement was refused for this token).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build --base=/SCOPE/
        env:
          VITE_SITE_URL: https://saranshsr.github.io/SCOPE
      - name: push dist to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -m "deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
