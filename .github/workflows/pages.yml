# Deploys every push on main to GitHub Pages. Two delivery paths so either
# Pages source setting works: the gh-pages branch (source: deploy-from-branch)
# and the official artifact path (source: GitHub Actions). Whichever source
# the repo settings select, one of these serves; the other is harmless.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vite build --base=/SCOPE/
        env:
          VITE_SITE_URL: https://saranshsr.github.io/SCOPE
      - name: push dist to gh-pages (branch source)
        run: |
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -m "deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy-artifact:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
